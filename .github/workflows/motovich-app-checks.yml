name: MOTOVICH app checks

on:
  push:
    branches: [main]
    paths:
      - "motovich-app/**"
      - "supabase/**"
      - ".github/workflows/motovich-app-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "motovich-app/**"
      - "supabase/**"
      - ".github/workflows/motovich-app-checks.yml"

jobs:
  static-checks:
    name: Check app scripts and PWA files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test Russian voice task parsing
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const voice = require('./motovich-app/voice-task.js');
          const now = new Date(2026, 9, 21, 12, 0, 0);
          const one = voice.parseOne('Позвонить поставщику завтра в 10 утра срочно', now);
          assert.equal(one.name, 'Позвонить поставщику');
          assert.equal(one.date, '2026-10-22');
          assert.equal(one.time, '10:00');
          assert.equal(one.priority, 'Высокий');

          const many = voice.parseTasks('Купить молоко завтра в 18; Позвонить поставщику в пятницу в 10:30; Отправить отчёт 25.10.2026', now);
          assert.equal(many.length, 3, JSON.stringify(many));
          assert.equal(many[0].name, 'Купить молоко');
          assert.equal(many[0].date, '2026-10-22');
          assert.equal(many[0].time, '18:00');
          assert.equal(many[1].date, '2026-10-23');
          assert.equal(many[1].time, '10:30');
          assert.equal(many[2].date, '2026-10-25');
          assert.equal(voice.parseOne('Подготовить презентацию 5 ноября', now).date, '2026-11-05');
          assert.equal(voice.parseOne('Купить хлеб через 3 дня', now).date, '2026-10-24');
          assert.equal(voice.parseOne('Позвонить клиенту в 7 вечера', now).time, '19:00');
          assert.equal(voice.parseOne('Сделать задачу 31.02.2026', now).date, '');
          const commaBatch = voice.parseTasks('Позвонить маме завтра, купить продукты в пятницу в 18, отправить отчёт в 15:30', now);
          assert.equal(commaBatch.length, 3, JSON.stringify(commaBatch));
          assert.equal(commaBatch[0].date, '2026-10-22');
          assert.equal(commaBatch[1].date, '2026-10-23');
          assert.equal(commaBatch[1].time, '18:00');
          assert.equal(commaBatch[2].time, '15:30');
          const conjunctionBatch = voice.parseTasks('Позвонить маме завтра и отправить отчёт в пятницу', now);
          assert.equal(conjunctionBatch.length, 2, JSON.stringify(conjunctionBatch));
          assert.equal(voice.parseOne('Купить хлеб не срочно', now).priority, 'Низкий');
          console.log('Voice parser tests passed: dates, weekdays, time, priorities, and batches.');
          NODE
      - name: Check external JavaScript
        run: |
          node --check motovich-app/advanced.js
          node --check motovich-app/pro.js
          node --check motovich-app/cloud-sync.js
          node --check motovich-app/voice-task.js
          node --check motovich-app/sw.js
      - name: Extract and check inline JavaScript
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('motovich-app/index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Inline app script was not found');
          for (const file of ['advanced.js', 'pro.js', 'cloud-sync.js', 'voice-task.js']) {
            if (!html.includes('<script src="' + file + '"></script>')) {
              throw new Error('Missing script link: ' + file);
            }
          }
          fs.writeFileSync('/tmp/motovich-inline.js', match[1]);
          const manifest = JSON.parse(fs.readFileSync('motovich-app/manifest.webmanifest', 'utf8'));
          if (!manifest.name || !manifest.id || !manifest.start_url || !manifest.scope) {
            throw new Error('PWA manifest is missing required fields');
          }
          if (!manifest.icons || !manifest.icons.some(i => i.src === 'icon-192.png' && i.sizes === '192x192') || !manifest.icons.some(i => i.src === 'icon-512.png' && i.sizes === '512x512') || !manifest.icons.some(i => i.src === 'icon-maskable-512.png' && i.purpose === 'maskable')) throw new Error('PWA install icons must include raster 192 and 512 px assets');
          for (const legalFile of ['motovich-app/privacy.html', 'motovich-app/account-deletion.html', 'motovich-app/PLAY-STORE-READINESS.md', 'motovich-app/play-store-readiness.html', 'motovich-app/PLAY-STORE-LISTING.md', 'motovich-app/PLAY-TEST-PLAN.md', 'motovich-app/android/BUILD-ANDROID.md']) if (!fs.existsSync(legalFile)) throw new Error('Missing Play release prerequisite: ' + legalFile);
          if (!html.includes('./privacy.html') || !html.includes('./account-deletion.html')) throw new Error('In-app legal/data deletion links are missing');
          const privacy = fs.readFileSync('motovich-app/privacy.html', 'utf8');
          const deletion = fs.readFileSync('motovich-app/account-deletion.html', 'utf8');
          if (privacy.includes('dmwwiin@icloud.com') || deletion.includes('dmwwiin@icloud.com')) throw new Error('Do not publish an unverified developer support address');
          for (const disclosure of ['названием задачи', 'часовой пояс', 'техническую запись доставки', 'Push-провайдер']) if (!privacy.includes(disclosure)) throw new Error('Privacy policy must disclose scheduled reminder data: ' + disclosure);
          if (!deletion.includes('без входа') && !deletion.includes('Если вы не можете войти')) throw new Error('External account deletion instructions must be visible');
          const icon192 = fs.readFileSync('motovich-app/icon-192.png');
          const icon512 = fs.readFileSync('motovich-app/icon-512.png');
          const maskableIcon = fs.readFileSync('motovich-app/icon-maskable-512.png');
          if (icon192.readUInt32BE(16) !== 192 || icon192.readUInt32BE(20) !== 192 || icon512.readUInt32BE(16) !== 512 || icon512.readUInt32BE(20) !== 512 || maskableIcon.readUInt32BE(16) !== 512 || maskableIcon.readUInt32BE(20) !== 512) throw new Error('PWA raster icon dimensions do not match manifest');
          const sw = fs.readFileSync('motovich-app/sw.js', 'utf8');
          for (const asset of ['./index.html', './manifest.webmanifest', './icon.svg', './icon-192.png', './icon-512.png', './icon-maskable-512.png', './advanced.js', './pro.js', './cloud-sync.js', './voice-task.js']) {
            if (!sw.includes("'" + asset + "'")) throw new Error('Service worker does not cache ' + asset);
          }
          NODE
          node --check /tmp/motovich-inline.js
      - name: Validate complete navigation and section targets
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('motovich-app/index.html', 'utf8');
          const advanced = fs.readFileSync('motovich-app/advanced.js', 'utf8');
          const pro = fs.readFileSync('motovich-app/pro.js', 'utf8');
          const base = ['today', 'tasks', 'habits', 'focus', 'wellbeing', 'coach', 'stats', 'meditation', 'journal', 'goals', 'backup', 'settings'];
          const extra = ['planner', 'water', 'inbox', 'review', 'calendar', 'routines', 'achievements', 'music'];
          for (const id of base) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing base section: ' + id);
            // The redesigned home uses a generated side drawer, not a static bottom-nav entry.
            if (!pro.includes("['" + id + "'")) throw new Error('Missing base section from complete drawer navigation: ' + id);
          }
          for (const id of extra) {
            const sectionExists = html.includes('id="' + id + '"') ||
              advanced.includes("addSection('" + id + "'") ||
              pro.includes("addSection('" + id + "'");
            if (!sectionExists) throw new Error('Missing section definition: ' + id);
            if (!pro.includes("['" + id + "'")) throw new Error('Missing section from complete navigation reconciliation: ' + id);
          }
          console.log('Validated ' + (base.length + extra.length) + ' navigation targets.');
          const backupTokens = ["8*1024*1024", "bad-shape", "bad-record"];
          for (const token of backupTokens) {
            if (!html.includes(token)) throw new Error('Backup import safety guard missing: ' + token);
          }
          if (!advanced.includes('validSnapshotData') ||
              !advanced.includes('restoreAutosave') ||
              !advanced.includes("KEY+'.autosave'")) {
            throw new Error('Local autosave recovery controls are incomplete');
          }
          for (const token of ['installOnIOS', 'navigator.standalone===true', 'Как установить на iPhone', 'Поделиться» → «На экран Домой']) {
            if (!advanced.includes(token)) throw new Error('iPhone PWA install help missing: ' + token);
          }
          if (!pro.includes('.drawer{overflow-y:auto')) {
            throw new Error('Mobile side drawer must support vertical scrolling');
          }
          for (const token of ["e.key==='Escape'", "e.key!=='Tab'", "aria-expanded", "aria-controls"]) {
            if (!pro.includes(token)) throw new Error('Drawer accessibility feature missing: ' + token);
          }
          for (const token of ["e.ctrlKey||e.metaKey", "e.key.toLowerCase()==='k'", "quickAddTask()"]) {
            if (!advanced.includes(token)) throw new Error('Keyboard quick-add shortcut missing: ' + token);
          }
          if (!html.includes("a.download='motovich-backup-'")) {
            throw new Error('Backup download action is missing');
          }
          for (const token of ["ensureRecords", "needsStateUpgrade", "state.schemaVersion=2"]) {
            if (!html.includes(token)) throw new Error('Local state migration safeguard missing: ' + token);
          }
          for (const token of ['id="voiceTaskBtn"', 'id="voiceTaskStatus"', 'window.SpeechRecognition||window.webkitSpeechRecognition', "recognition.lang='ru-RU'", 'setupVoiceTaskInput();']) {
            if (!html.includes(token)) throw new Error('Russian voice task input safeguard missing: ' + token);
          }
          if (!html.includes('Диктовка в браузере недоступна.')) {
            throw new Error('Voice dictation fallback is missing');
          }
          const serviceWorker = fs.readFileSync('motovich-app/sw.js', 'utf8');
          for (const token of ["self.addEventListener('push'", "self.addEventListener('notificationclick'", 'showNotification', 'safeAppPath', '!Array.isArray(parsed)']) {
            if (!serviceWorker.includes(token)) throw new Error('PWA notification/offline safeguard missing: ' + token);
          }
          const cacheVersion = serviceWorker.match(/const CACHE = 'motovich-shell-v[0-9]+'/);
          if (!cacheVersion) throw new Error('Service worker cache version must be explicit and versioned');
          for (const asset of ['./index.html', './manifest.webmanifest', './icon.svg', './icon-192.png', './icon-512.png', './icon-maskable-512.png', './privacy.html', './account-deletion.html', './play-store-readiness.html', './advanced.js', './pro.js', './cloud-sync.js', './voice-task.js']) {
            if (!serviceWorker.includes("'" + asset + "'")) throw new Error('Offline shell is missing required asset: ' + asset);
          }
          console.log('Validated service worker cache version ' + cacheVersion[1]);
          // The current home is a minimal task inbox with a focused quick composer.
          for (const token of ['id="quickAddFab"', 'id="quickVoiceFab"', 'id="aiTaskComposer"', 'id="aiTaskInput"', 'function setupQuickTaskComposer()', 'body.composer-editing', 'function closeComposer()']) {
            if (!html.includes(token)) throw new Error('Quick task composer requirement missing: ' + token);
          }
          const timerCount = (html.match(/id="timerDisplay"/g) || []).length;
          if (timerCount !== 1) throw new Error('Expected exactly one primary timer display in the app');
          const todaySection = html.slice(html.indexOf('<section class="section active" id="today">'), html.indexOf('<section class="section" id="tasks">'));
          const focusSection = html.slice(html.indexOf('<section class="section" id="focus">'), html.indexOf('<section class="section" id="wellbeing">'));
          if (todaySection.includes('id="timerDisplay"')) throw new Error('Primary timer must not appear on the home screen');
          if (!focusSection.includes('<h2>⏱ Таймер фокуса</h2>') || focusSection.indexOf('id="timerDisplay"') < 0) {
            throw new Error('Full focus timer must be placed in the Work Timer section');
          }
          if (!advanced.includes("const focusCard=$('timerDisplay')?.closest('.card')")) {
            throw new Error('Advanced focus controls must attach to the primary timer card');
          }
          if (!pro.includes("const fc=$('timerDisplay')?.closest('.card');if(fc&&!$('focusMorePro')&&!$('focusCustom'))")) {
            throw new Error('Pro focus controls must avoid duplicating the advanced focus controls');
          }
          for (const token of ["const TIMER_KEY=KEY+'.focusTimer'", 'function saveTimerState()', 'function restoreTimerState()', 'function startTimer(resume=false)', 'Math.ceil((timerDeadline-Date.now())/1000)', 'deadline:timerDeadline||0', 'restoreTimerState();']) {
            if (!html.includes(token)) throw new Error('Persistent focus timer safeguard missing: ' + token);
          }
          for (const token of ['function recordFocusCompletion()', 'state.focusHistory.push({id:String(Date.now())', 'id="weeklyFocusChart"', 'id="weeklyFocusSummary"']) {
            if (!html.includes(token)) throw new Error('Focus history/statistics feature missing: ' + token);
          }
          for (const token of ['id="calQuickTaskForm"', 'id="calQuickTaskName"', 'id="calQuickTaskDate"', "state.tasks.push({id:String(Date.now())", "renderCalendar();", "Задача добавлена в календарь"]) {
            if (!pro.includes(token)) throw new Error('Calendar quick-task workflow missing: ' + token);
          }
          for (const token of ['calendar-task', 'Отметить задачу: ', 'Редактировать ', 'Удалить задачу «']) {
            if (!pro.includes(token)) throw new Error('Calendar task management control missing: ' + token);
          }
          for (const token of ["addSection('music'", "const musicTracks=", "meditation:[", "work:[", "function playMusic(i)", "function stopMusic()", "data-music-category", "renderMusic();"]) {
            if (!pro.includes(token)) throw new Error('Music section/player feature missing: ' + token);
          }
          for (const token of ['musicSleepDeadline', 'function updateMusicSleepTimer()', 'id="musicSleepTimer"', 'id="musicSleepStart"', "localStorage.setItem('motovich.music.sleepDeadline'", "document.addEventListener('visibilitychange'"]) {
            if (!pro.includes(token)) throw new Error('Music sleep timer feature missing: ' + token);
          }
          for (const token of ["if($('coachGoal')&&!$('coachTemplatesPro')&&!$('coachTemplates'))", "w.id='coachTemplatesPro'"]) {
            if (!pro.includes(token)) throw new Error('AI coach prompt deduplication safeguard missing: ' + token);
          }
          for (const token of ["routines:[{id:'morning'", "const optionalArrays=['taskHistory','wellbeingHistory','focusHistory','quickNotes','routines']", "const optionalObjects=['habitHistory','waterLog','routineLog','weeklyReviews','achievements','wellbeing','preferences','energyHistory']"]) {
            if (!html.includes(token)) throw new Error('Backup recovery compatibility safeguard missing: ' + token);
          }
          if (!html.includes("{id:'music',name:'Музыка',icon:'♫'}")) {
            throw new Error('Music section is missing from home dashboard catalogue');
          }
          const widgetBlock = html.match(/const HOME_WIDGETS=(\[[\s\S]*?\]);if\(!Array\.isArray\(state\.homeWidgets\)\)/);
          if (!widgetBlock) throw new Error('Home dashboard widget catalogue is missing');
          const widgetIds = [...widgetBlock[1].matchAll(/id:'([^']+)'/g)].map(match => match[1]);
          const expectedWidgets = [...base, ...extra].filter(id => id !== 'today');
          for (const id of expectedWidgets) {
            if (!widgetIds.includes(id)) throw new Error('Section cannot be added to home dashboard: ' + id);
          }
          if (new Set(widgetIds).size !== widgetIds.length) throw new Error('Home dashboard contains duplicate widget IDs');
          for (const token of ['function homeWidgetDetail(id)', 'function moveHomeWidget(id,delta)', 'function removeHomeWidget(id)', "state.homeWidgets.push(id)", 'Переместить ']) {
            if (!html.includes(token)) throw new Error('Dashboard preview/reordering control missing: ' + token);
          }
          console.log('Backup, voice input, home dashboard, offline, and notification-handler checks passed.');
          NODE
      - name: Set up Deno for the Edge Function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check authenticated AI Edge Function
        run: |
          deno check supabase/functions/coach/index.ts
          deno check supabase/functions/push-send/index.ts
          deno check supabase/functions/delete-account/index.ts
          deno check supabase/functions/push-test/index.ts
          deno check supabase/functions/push-schedule/index.ts
          deno test supabase/functions/push-schedule/schedule-core.test.ts
      - name: Validate backend security contract
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('motovich-app/index.html', 'utf8');
          const sql = fs.readFileSync('supabase/migrations/202610210001_motovich_cloud.sql', 'utf8');
          const pushSql = fs.readFileSync('supabase/migrations/202610210002_motovich_push.sql', 'utf8');
          const cronSql = fs.readFileSync('supabase/setup/push-schedule-cron.sql', 'utf8');
          const twaExample = JSON.parse(fs.readFileSync('motovich-app/android/twa-manifest.example.json', 'utf8'));
          const androidIgnore = fs.readFileSync('motovich-app/android/.gitignore', 'utf8');
          const fn = fs.readFileSync('supabase/functions/coach/index.ts', 'utf8');
          const pushFn = fs.readFileSync('supabase/functions/push-send/index.ts', 'utf8');
          const deleteFn = fs.readFileSync('supabase/functions/delete-account/index.ts', 'utf8');
          const pushTestFn = fs.readFileSync('supabase/functions/push-test/index.ts', 'utf8');
          const schedulerFn = fs.readFileSync('supabase/functions/push-schedule/index.ts', 'utf8');
          const deployWorkflow = fs.readFileSync('.github/workflows/deploy-supabase.yml', 'utf8');
          const deliveriesSql = fs.readFileSync('supabase/migrations/202610210003_motovich_push_deliveries.sql', 'utf8');
          const cfg = fs.readFileSync('supabase/config.toml', 'utf8');
          const gitignore = fs.readFileSync('supabase/.gitignore', 'utf8');
          for (const policy of ['motovich state select own', 'motovich state insert own', 'motovich state update own', 'motovich state delete own']) {
            if (!sql.includes(policy)) throw new Error('Missing owner-only RLS policy: ' + policy);
          }
          for (const token of ['enable row level security', 'motovich_consume_ai_coach_request', 'request_count < 30']) {
            if (!sql.includes(token)) throw new Error('Missing backend guard: ' + token);
          }
          for (const token of ['auth.getUser()', 'AbortSignal.timeout', 'store: false', 'MAX_BODY_BYTES', 'OPENAI_API_KEY']) {
            if (!fn.includes(token)) throw new Error('Missing AI endpoint safeguard: ' + token);
          }
          if (fn.includes('SUPABASE_SERVICE_ROLE_KEY') || fn.includes('sb_secret_')) {
            throw new Error('Privileged Supabase keys must not be embedded in the function source');
          }
          if (!cfg.includes('verify_jwt = true') || !cfg.includes('[functions.coach]')) throw new Error('AI function must require JWT verification');
          for (const token of ['motovich_push_subscriptions', 'enable row level security', 'motovich push select own', 'motovich push insert own', 'motovich push update own', 'motovich push delete own']) {
            if (!pushSql.includes(token)) throw new Error('Missing owner-only Web Push security control: ' + token);
          }
          for (const token of ['MOTOVICH_PUSH_CRON_SECRET', 'timingSafeEqual', 'VAPID_PRIVATE_KEY', 'sendNotification', 'statusCode === 404 || statusCode === 410', 'readBoundedJson', 'MAX_BODY_BYTES', 'truncatedAtSafetyLimit']) {
            if (!pushFn.includes(token)) throw new Error('Missing protected push sender safeguard: ' + token);
          }
          if (!cfg.includes('[functions.push-send]') || !cfg.includes('verify_jwt = false')) throw new Error('Internal push function config missing');
          for (const token of ['auth.getUser', 'auth.admin.deleteUser', 'DELETE_MY_ACCOUNT', 'Access-Control-Allow-Origin']) if (!deleteFn.includes(token)) throw new Error('Missing secure account deletion safeguard: ' + token);
          if (!cfg.includes('[functions.delete-account]') || !cfg.includes('verify_jwt = true')) throw new Error('Account deletion must require an authenticated JWT');
          for (const token of ['auth.getUser', 'motovich_push_subscriptions', 'sendNotification', 'VAPID_PRIVATE_KEY', 'user_id']) if (!pushTestFn.includes(token)) throw new Error('Missing user-scoped push test safeguard: ' + token);
          if (!cfg.includes('[functions.push-test]') || !cfg.includes('verify_jwt = true')) throw new Error('Push test function must require an authenticated JWT');
          for (const token of ['MOTOVICH_PUSH_CRON_SECRET', 'timingSafeEqual', 'timeZone', 'motovich_push_deliveries', 'claim_token', 'VAPID_PRIVATE_KEY']) if (!schedulerFn.includes(token)) throw new Error('Missing scheduled reminder safeguard: ' + token);
          for (const token of ['motovich_push_deliveries', 'enable row level security', 'motovich_push_delivery_once', 'revoke all']) if (!deliveriesSql.toLowerCase().includes(token.toLowerCase())) throw new Error('Missing server-only delivery ledger safeguard: ' + token);
          for (const token of ['motovich-push-schedule', '* * * * *', 'vault.decrypted_secrets', 'x-motovich-cron-secret']) if (!cronSql.includes(token)) throw new Error('Missing safe cron setup instruction: ' + token);
          if (twaExample.packageId !== 'app.motovich.productivity' || !twaExample.host || !twaExample.webManifestUrl || !twaExample.maskableIconUrl.endsWith('icon-maskable-512.png')) throw new Error('TWA example manifest is missing required app/host/maskable fields');
          for (const token of ['*.keystore', '*.jks', '*.aab', '*.apk', 'twa-manifest.json']) if (!androidIgnore.includes(token)) throw new Error('Signing material / Android artifacts must be ignored by Git: ' + token);
          if (!cfg.includes('[functions.push-schedule]') || !cfg.includes('verify_jwt = false')) throw new Error('Scheduler must be cron-only and secret-protected');
          for (const token of ['workflow_dispatch:', "inputs.confirmation == 'DEPLOY'", 'supabase --yes db push --linked', 'supabase secrets set --project-ref', 'supabase functions deploy "$fn"']) if (!deployWorkflow.includes(token)) throw new Error('Manual backend deployment workflow is missing a required step: ' + token);
          if (deployWorkflow.includes('secrets.SUPABASE_SERVICE_ROLE_KEY') || deployWorkflow.includes('write_secret SUPABASE_SERVICE_ROLE_KEY')) throw new Error('Do not deploy the reserved SUPABASE_ secret prefix through secrets set');
          if (pushFn.includes('sk-proj-') || pushFn.includes('sb_secret_')) throw new Error('No live service secrets should be embedded in source');
          if (!gitignore.includes('functions/.env')) throw new Error('Local function secrets must be ignored by Git');
          const cloudClient = fs.readFileSync('motovich-app/cloud-sync.js', 'utf8');
          for (const token of ['cloudPush', 'cloudPull', 'beforeCloudPull', 'validatedConfig', 'secretLikeKey', 'schema_version: 2', 'cloudPushEnable', 'cloudPushDisable', 'cloudPushTest', 'sendTestPush', 'push-test', 'cloudDeleteAccount', 'deleteCloudAccount', 'delete-account', 'DELETE_MY_ACCOUNT', 'vapidKeyBytes', 'motovich_push_subscriptions', 'applicationServerKey', 'Notification.requestPermission', 'LAST_SYNC_KEY', 'renderLastSync()', 'saveLastSync(', 'id="cloudLastSync"']) {
            if (!cloudClient.includes(token)) throw new Error('Cloud client safety feature missing: ' + token);
          }
          if (!cloudClient.includes('id="cloudVapidPublicKey" class="field" type="text"')) throw new Error('Public VAPID key must be visible/copyable (not hidden as a secret)');
          if (!cloudClient.includes('Быстрая инструкция по запуску')) throw new Error('Cloud panel is missing its setup checklist');
          if (!html.includes('window.MOTOVICHBuildLocalCoachPlan = function(goalValue)')) throw new Error('Local coach fallback function is missing');
          if (!cloudClient.includes('MOTOVICHBuildLocalCoachPlan(prompt)') || !cloudClient.includes('Внешний AI-коуч недоступен; показан локальный план.')) throw new Error('Cloud coach must fall back to local plan when remote AI fails');
          if (!cloudClient.includes("'/rest/v1/motovich_user_state?on_conflict=user_id'")) {
            throw new Error('Cloud sync must target the RLS-protected user-state table');
          }
          console.log('Backend security and cloud client contract checks passed.');
          NODE
