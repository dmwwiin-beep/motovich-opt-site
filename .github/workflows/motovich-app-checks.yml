name: MOTOVICH app checks

on:
  push:
    branches: [main]
    paths:
      - "motovich-app/**"
      - ".github/workflows/motovich-app-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "motovich-app/**"
      - ".github/workflows/motovich-app-checks.yml"

jobs:
  static-checks:
    name: Check app scripts and PWA files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check external JavaScript
        run: |
          node --check motovich-app/advanced.js
          node --check motovich-app/pro.js
          node --check motovich-app/sw.js
      - name: Extract and check inline JavaScript
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('motovich-app/index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Inline app script was not found');
          for (const file of ['advanced.js', 'pro.js']) {
            if (!html.includes('<script src="' + file + '"></script>')) {
              throw new Error('Missing script link: ' + file);
            }
          }
          fs.writeFileSync('/tmp/motovich-inline.js', match[1]);
          const manifest = JSON.parse(fs.readFileSync('motovich-app/manifest.webmanifest', 'utf8'));
          if (!manifest.name || !manifest.start_url || !manifest.scope) {
            throw new Error('PWA manifest is missing required fields');
          }
          const sw = fs.readFileSync('motovich-app/sw.js', 'utf8');
          for (const asset of ['./index.html', './manifest.webmanifest', './icon.svg', './advanced.js', './pro.js']) {
            if (!sw.includes("'" + asset + "'")) throw new Error('Service worker does not cache ' + asset);
          }
          NODE
          node --check /tmp/motovich-inline.js
      - name: Validate complete navigation and section targets
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('motovich-app/index.html', 'utf8');
          const advanced = fs.readFileSync('motovich-app/advanced.js', 'utf8');
          const pro = fs.readFileSync('motovich-app/pro.js', 'utf8');
          const base = ['today', 'tasks', 'habits', 'focus', 'wellbeing', 'coach', 'stats', 'meditation', 'journal', 'goals', 'backup', 'settings'];
          const extra = ['planner', 'water', 'inbox', 'review', 'calendar', 'routines', 'achievements'];
          for (const id of base) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing base section: ' + id);
            if (!html.includes('data-section="' + id + '"')) throw new Error('Missing base navigation entry: ' + id);
          }
          for (const id of extra) {
            const sectionExists = html.includes('id="' + id + '"') ||
              advanced.includes("addSection('" + id + "'") ||
              pro.includes("addSection('" + id + "'");
            if (!sectionExists) throw new Error('Missing section definition: ' + id);
            if (!pro.includes("['" + id + "'")) throw new Error('Missing section from complete navigation reconciliation: ' + id);
          }
          console.log('Validated ' + (base.length + extra.length) + ' navigation targets.');
          const backupTokens = ["8*1024*1024", "bad-shape", "bad-record"];
          for (const token of backupTokens) {
            if (!html.includes(token)) throw new Error('Backup import safety guard missing: ' + token);
          }
          if (!advanced.includes('validSnapshotData') ||
              !advanced.includes('restoreAutosave') ||
              !advanced.includes("KEY+'.autosave'")) {
            throw new Error('Local autosave recovery controls are incomplete');
          }
          if (!html.includes("a.download='motovich-backup-'")) {
            throw new Error('Backup download action is missing');
          }
          console.log('Backup import safety and autosave recovery checks passed.');
          NODE
