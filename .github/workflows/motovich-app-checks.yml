name: MOTOVICH app checks

on:
  push:
    branches: [main]
    paths:
      - "motovich-app/**"
      - "supabase/**"
      - ".github/workflows/motovich-app-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "motovich-app/**"
      - "supabase/**"
      - ".github/workflows/motovich-app-checks.yml"

jobs:
  static-checks:
    name: Check app scripts and PWA files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check external JavaScript
        run: |
          node --check motovich-app/advanced.js
          node --check motovich-app/pro.js
          node --check motovich-app/cloud-sync.js
          node --check motovich-app/sw.js
      - name: Extract and check inline JavaScript
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('motovich-app/index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Inline app script was not found');
          for (const file of ['advanced.js', 'pro.js', 'cloud-sync.js']) {
            if (!html.includes('<script src="' + file + '"></script>')) {
              throw new Error('Missing script link: ' + file);
            }
          }
          fs.writeFileSync('/tmp/motovich-inline.js', match[1]);
          const manifest = JSON.parse(fs.readFileSync('motovich-app/manifest.webmanifest', 'utf8'));
          if (!manifest.name || !manifest.start_url || !manifest.scope) {
            throw new Error('PWA manifest is missing required fields');
          }
          const sw = fs.readFileSync('motovich-app/sw.js', 'utf8');
          for (const asset of ['./index.html', './manifest.webmanifest', './icon.svg', './advanced.js', './pro.js', './cloud-sync.js']) {
            if (!sw.includes("'" + asset + "'")) throw new Error('Service worker does not cache ' + asset);
          }
          NODE
          node --check /tmp/motovich-inline.js
      - name: Validate complete navigation and section targets
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('motovich-app/index.html', 'utf8');
          const advanced = fs.readFileSync('motovich-app/advanced.js', 'utf8');
          const pro = fs.readFileSync('motovich-app/pro.js', 'utf8');
          const base = ['today', 'tasks', 'habits', 'focus', 'wellbeing', 'coach', 'stats', 'meditation', 'journal', 'goals', 'backup', 'settings'];
          const extra = ['planner', 'water', 'inbox', 'review', 'calendar', 'routines', 'achievements', 'music'];
          for (const id of base) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing base section: ' + id);
            if (!html.includes('data-section="' + id + '"')) throw new Error('Missing base navigation entry: ' + id);
          }
          for (const id of extra) {
            const sectionExists = html.includes('id="' + id + '"') ||
              advanced.includes("addSection('" + id + "'") ||
              pro.includes("addSection('" + id + "'");
            if (!sectionExists) throw new Error('Missing section definition: ' + id);
            if (!pro.includes("['" + id + "'")) throw new Error('Missing section from complete navigation reconciliation: ' + id);
          }
          console.log('Validated ' + (base.length + extra.length) + ' navigation targets.');
          const backupTokens = ["8*1024*1024", "bad-shape", "bad-record"];
          for (const token of backupTokens) {
            if (!html.includes(token)) throw new Error('Backup import safety guard missing: ' + token);
          }
          if (!advanced.includes('validSnapshotData') ||
              !advanced.includes('restoreAutosave') ||
              !advanced.includes("KEY+'.autosave'")) {
            throw new Error('Local autosave recovery controls are incomplete');
          }
          for (const token of ['installOnIOS', 'navigator.standalone===true', 'Как установить на iPhone', 'Поделиться» → «На экран Домой']) {
            if (!advanced.includes(token)) throw new Error('iPhone PWA install help missing: ' + token);
          }
          if (!pro.includes('.drawer{overflow-y:auto')) {
            throw new Error('Mobile side drawer must support vertical scrolling');
          }
          for (const token of ["e.key==='Escape'", "e.key!=='Tab'", "aria-expanded", "aria-controls"]) {
            if (!pro.includes(token)) throw new Error('Drawer accessibility feature missing: ' + token);
          }
          for (const token of ["e.ctrlKey||e.metaKey", "e.key.toLowerCase()==='k'", "quickAddTask()"]) {
            if (!advanced.includes(token)) throw new Error('Keyboard quick-add shortcut missing: ' + token);
          }
          if (!html.includes("a.download='motovich-backup-'")) {
            throw new Error('Backup download action is missing');
          }
          for (const token of ["ensureRecords", "needsStateUpgrade", "state.schemaVersion=2"]) {
            if (!html.includes(token)) throw new Error('Local state migration safeguard missing: ' + token);
          }
          for (const token of ['id="voiceTaskBtn"', 'id="voiceTaskStatus"', 'window.SpeechRecognition||window.webkitSpeechRecognition', "recognition.lang='ru-RU'", 'setupVoiceTaskInput();']) {
            if (!html.includes(token)) throw new Error('Russian voice task input safeguard missing: ' + token);
          }
          if (!html.includes('Диктовка в браузере недоступна.')) {
            throw new Error('Voice dictation fallback is missing');
          }
          const serviceWorker = fs.readFileSync('motovich-app/sw.js', 'utf8');
          for (const token of ["self.addEventListener('push'", "self.addEventListener('notificationclick'", 'showNotification', 'safeAppPath', '!Array.isArray(parsed)', 'motovich-shell-v13']) {
            if (!serviceWorker.includes(token)) throw new Error('PWA notification/offline safeguard missing: ' + token);
          }
          for (const token of ['homeWidgets:', 'function renderHomeWidgets()', 'function removeHomeWidget(id)', "state.homeWidgets.push(id)", 'id="homeWidgetSelect"', 'id="confirmHomeWidget"']) {
            if (!html.includes(token)) throw new Error('Home dashboard customization feature missing: ' + token);
          }
          for (const token of ['home-quick-actions', 'class="home-action-grid"', "function homeQuickAction(action)", "homeQuickAction('task')", "homeQuickAction('note')", "homeQuickAction('water')", "homeQuickAction('focus')", "homeQuickAction('meditation')"]) {
            if (!html.includes(token)) throw new Error('Home quick action missing: ' + token);
          }
          for (const token of ["const TIMER_KEY=KEY+'.focusTimer'", 'function saveTimerState()', 'function restoreTimerState()', 'function startTimer(resume=false)', 'Math.ceil((timerDeadline-Date.now())/1000)', 'deadline:timerDeadline||0', 'restoreTimerState();']) {
            if (!html.includes(token)) throw new Error('Persistent focus timer safeguard missing: ' + token);
          }
          for (const token of ['id="calQuickTaskForm"', 'id="calQuickTaskName"', 'id="calQuickTaskDate"', "state.tasks.push({id:String(Date.now())", "renderCalendar();", "Задача добавлена в календарь"]) {
            if (!pro.includes(token)) throw new Error('Calendar quick-task workflow missing: ' + token);
          }
          for (const token of ["id='music'", "const musicTracks=", "meditation:[", "work:[", "function playMusic(i)", "function stopMusic()", "data-music-category", "renderMusic();"]) {
            if (!pro.includes(token)) throw new Error('Music section/player feature missing: ' + token);
          }
          if (!html.includes("{id:'music',name:'Музыка',icon:'♫'}")) {
            throw new Error('Music section is missing from home dashboard catalogue');
          }
          const widgetBlock = html.match(/const HOME_WIDGETS=(\[[\s\S]*?\]);if\(!Array\.isArray\(state\.homeWidgets\)\)/);
          if (!widgetBlock) throw new Error('Home dashboard widget catalogue is missing');
          const widgetIds = [...widgetBlock[1].matchAll(/id:'([^']+)'/g)].map(match => match[1]);
          const expectedWidgets = [...base, ...extra].filter(id => id !== 'today');
          for (const id of expectedWidgets) {
            if (!widgetIds.includes(id)) throw new Error('Section cannot be added to home dashboard: ' + id);
          }
          if (new Set(widgetIds).size !== widgetIds.length) throw new Error('Home dashboard contains duplicate widget IDs');
          for (const token of ['function homeWidgetDetail(id)', 'function moveHomeWidget(id,delta)', 'function removeHomeWidget(id)', "state.homeWidgets.push(id)", 'Переместить ']) {
            if (!html.includes(token)) throw new Error('Dashboard preview/reordering control missing: ' + token);
          }
          console.log('Backup, voice input, home dashboard, offline, and notification-handler checks passed.');
          NODE
      - name: Set up Deno for the Edge Function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check authenticated AI Edge Function
        run: |
          deno check supabase/functions/coach/index.ts
          deno check supabase/functions/push-send/index.ts
      - name: Validate backend security contract
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const sql = fs.readFileSync('supabase/migrations/202610210001_motovich_cloud.sql', 'utf8');
          const pushSql = fs.readFileSync('supabase/migrations/202610210002_motovich_push.sql', 'utf8');
          const fn = fs.readFileSync('supabase/functions/coach/index.ts', 'utf8');
          const pushFn = fs.readFileSync('supabase/functions/push-send/index.ts', 'utf8');
          const cfg = fs.readFileSync('supabase/config.toml', 'utf8');
          const gitignore = fs.readFileSync('supabase/.gitignore', 'utf8');
          for (const policy of ['motovich state select own', 'motovich state insert own', 'motovich state update own', 'motovich state delete own']) {
            if (!sql.includes(policy)) throw new Error('Missing owner-only RLS policy: ' + policy);
          }
          for (const token of ['enable row level security', 'motovich_consume_ai_coach_request', 'request_count < 30']) {
            if (!sql.includes(token)) throw new Error('Missing backend guard: ' + token);
          }
          for (const token of ['auth.getUser()', 'AbortSignal.timeout', 'store: false', 'MAX_BODY_BYTES', 'OPENAI_API_KEY']) {
            if (!fn.includes(token)) throw new Error('Missing AI endpoint safeguard: ' + token);
          }
          if (fn.includes('SUPABASE_SERVICE_ROLE_KEY') || fn.includes('sb_secret_')) {
            throw new Error('Privileged Supabase keys must not be embedded in the function source');
          }
          if (!cfg.includes('verify_jwt = true') || !cfg.includes('[functions.coach]')) throw new Error('AI function must require JWT verification');
          for (const token of ['motovich_push_subscriptions', 'enable row level security', 'motovich push select own', 'motovich push insert own', 'motovich push update own', 'motovich push delete own']) {
            if (!pushSql.includes(token)) throw new Error('Missing owner-only Web Push security control: ' + token);
          }
          for (const token of ['MOTOVICH_PUSH_CRON_SECRET', 'timingSafeEqual', 'VAPID_PRIVATE_KEY', 'sendNotification', 'statusCode === 404 || statusCode === 410', 'readBoundedJson', 'MAX_BODY_BYTES', 'truncatedAtSafetyLimit']) {
            if (!pushFn.includes(token)) throw new Error('Missing protected push sender safeguard: ' + token);
          }
          if (!cfg.includes('[functions.push-send]') || !cfg.includes('verify_jwt = false')) throw new Error('Internal push function config missing');
          if (pushFn.includes('sk-proj-') || pushFn.includes('sb_secret_')) throw new Error('No live service secrets should be embedded in source');
          if (!gitignore.includes('functions/.env')) throw new Error('Local function secrets must be ignored by Git');
          const cloudClient = fs.readFileSync('motovich-app/cloud-sync.js', 'utf8');
          for (const token of ['cloudPush', 'cloudPull', 'beforeCloudPull', 'validatedConfig', 'secretLikeKey', 'schema_version: 2', 'cloudPushEnable', 'cloudPushDisable', 'vapidKeyBytes', 'motovich_push_subscriptions', 'applicationServerKey', 'Notification.requestPermission']) {
            if (!cloudClient.includes(token)) throw new Error('Cloud client safety feature missing: ' + token);
          }
          if (!cloudClient.includes("'/rest/v1/motovich_user_state?on_conflict=user_id'")) {
            throw new Error('Cloud sync must target the RLS-protected user-state table');
          }
          console.log('Backend security and cloud client contract checks passed.');
          NODE
